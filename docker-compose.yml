services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
      image: redis:7
      ports:
        - "6379:6379"
      volumes:
        - redisdata:/data
      command: redis-server --save 60 1
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 5

  api1:
      build: .
      environment:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/urlshortener
        REDIS_URL: redis://redis:6379/0
        INSTANCE_ID: "1"
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy

  api2:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api3:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

  locust:
      build: .
      ports:
        - "8089:8089"
      command: locust -f locustfile_read_only.py --host http://nginx
      depends_on:
        - nginx

volumes:
  pgdata:
  redisdata: